spring.datasource.url=jdbc:h2:mem:jobmatch-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.address=0.0.0.0
cors.allowed-origins=http://localhost:5173
spring.application.name=jobmatch-ai
security.enabled=false
gemini.api.key=test-key
gemini.model=test-model
gemini.timeout-ms=30000
gemini.retry-attempts=2
gemini.retry-delay-ms=500
