spring.config.activate.on-profile=supabase
security.enabled=${SECURITY_ENABLED:true}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SUPABASE_DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${SUPABASE_DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
