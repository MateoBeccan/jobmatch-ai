spring.config.import=optional:file:.env[.properties]
spring.application.name=jobmatch-ai
server.port=${PORT:8080}
server.address=0.0.0.0
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:120000}
gemini.retry-attempts=${GEMINI_RETRY_ATTEMPTS:2}
gemini.retry-delay-ms=${GEMINI_RETRY_DELAY_MS:500}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobmatch;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
