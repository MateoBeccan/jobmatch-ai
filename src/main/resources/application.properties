spring.config.import=optional:file:.env[.properties]
spring.application.name=jobmatch-ai
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}
gemini.retry-attempts=${GEMINI_RETRY_ATTEMPTS:2}
gemini.retry-delay-ms=${GEMINI_RETRY_DELAY_MS:500}
gemini.max-concurrent-requests=${GEMINI_MAX_CONCURRENT_REQUESTS:4}

security.enabled=${SECURITY_ENABLED:false}
security.demo-username=${DEMO_USERNAME:demo}
security.demo-password=${DEMO_PASSWORD:demo-password}
rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:10}
analysis.max-description-length=${ANALYSIS_MAX_DESCRIPTION_LENGTH:5000}
analysis.max-pdf-pages=${ANALYSIS_MAX_PDF_PAGES:50}
analysis.max-pdf-text-length=${ANALYSIS_MAX_PDF_TEXT_LENGTH:50000}
analysis.history-max-page-size=${ANALYSIS_HISTORY_MAX_PAGE_SIZE:50}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobmatch;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
